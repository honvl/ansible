- hosts: '{{ target | default("firewall") }}'
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"  # EE Python that has pan-os-python etc.
  tasks:
    - name: Palo Alto check
      paloaltonetworks.panos.panos_check:
        provider:
          username: '{{ username }}'
          password: '{{ password }}'
          ip_address: '{{ inventory_hostname }}'
        timeout: 15
