---
# upgrade_ha.yml - Panorama HA upgrade playbook.
#
# Description
# ===========
#
# Upgrades a Panorama HA pair to the specified version, either a patch upgrade (i.e. 11.2.4 to 11.2.7) or a feature
# release upgrade (i.e. 11.2.7 to 12.1.3).  For a feature release upgrade, panos_software downloads the base image
# (X.Y.0, or 12.1.2 for 12.1) before the target version; this needs paloaltonetworks.panos 3.4.0 or later in the EE.
#
# This playbook requires connection details for the two members of the HA pair to be specified in the variables
# 'primary_ip_address', 'secondary_ip_address', 'username', and 'password'.  These may be defined as host variables
# (see `host_vars/panorama_ha_pair.yml` for an example) or extra vars.
#
# Usage
# =====
#
# Required variables:
#
#   target: Target Panorama HA pair.  See `host_vars/panorama_ha_pair.yml` for sample definition of host variables.
#
#   version: Version to install.
#
# See the VARS section of the playbook for additional customization options.
#
# Default run:
#
#  $ ansible-playbook -i inventory upgrade_ha.yml --extra-vars "target=panorama_ha_pair version=9.0.5"
#
# Notes
# =====
#
# HA pairs with preemption enabled are not supported by this playbook.
- hosts: '{{ target | default("panorama_ha_pair") }}'
  connection: local

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"  # EE Python that has pan-os-python etc.
    primary:
      ip_address: '{{ primary_ip_address }}'
      username: '{{ username | default(omit) }}'
      password: '{{ password | default(omit) }}'
      api_key: '{{ api_key | default(omit) }}'

    secondary:
      ip_address: '{{ secondary_ip_address }}'
      username: '{{ username | default(omit) }}'
      password: '{{ password | default(omit) }}'
      api_key: '{{ api_key | default(omit) }}'

    # backup_config - Create a backup of the currently running config before upgrading on both devices.
    backup_config: true

    # backup_filename - Filename for running config backup.
    backup_filename: 'ansible-backup-{{ ansible_date_time.date }}.xml'

    # pause_mid_upgrade - Optionally pause for additional verification during upgrade.  This playbook will perform
    #                     basic checks for HA status and session sync, but this will wait for manual verification before
    #                     upgrading the secondary firewall.
    pause_mid_upgrade: false

    # major_version_upgrade - Handles special case when one Panorama is on a different major version.  'auto' (default)
    #                         treats the upgrade as major when the primary's major.minor differs from the target's
    #                         (i.e. 11.2.x -> 12.1.x).  Set true/false to override.
    major_version_upgrade: auto

  tasks:
    # Panoramas already on the target version are skipped, so a rerun after a partial upgrade only finishes the other one.
    - name: Get current PAN-OS version (primary)
      paloaltonetworks.panos.panos_op:
        provider: '{{ primary }}'
        cmd: 'show system info'
      changed_when: false
      register: primary_info
      retries: 3
      delay: 10
      until: primary_info is not failed

    - name: Get current PAN-OS version (secondary)
      paloaltonetworks.panos.panos_op:
        provider: '{{ secondary }}'
        cmd: 'show system info'
      changed_when: false
      register: secondary_info
      retries: 3
      delay: 10
      until: secondary_info is not failed

    - name: Set current PAN-OS versions
      ansible.builtin.set_fact:
        primary_version: "{{ (primary_info.stdout | from_json).response.result.system['sw-version'] }}"
        secondary_version: "{{ (secondary_info.stdout | from_json).response.result.system['sw-version'] }}"

    - name: Detect major version upgrade
      ansible.builtin.set_fact:
        is_major_upgrade: "{{ (primary_version.split('.')[:2] != (version | string).split('.')[:2])
                              if (major_version_upgrade | string | lower) == 'auto' else (major_version_upgrade | bool) }}"

    - name: Show upgrade plan
      ansible.builtin.debug:
        msg: 'Primary {{ primary_version }}, secondary {{ secondary_version }}, target {{ version }}, major version upgrade: {{ is_major_upgrade | bool }}'

    - name: Skip upgrade, both Panoramas already on target version
      ansible.builtin.debug:
        msg: 'Both Panoramas ({{ primary.ip_address }}, {{ secondary.ip_address }}) are already running PAN-OS {{ version }}, skipping upgrade.'
      when: primary_version == version and secondary_version == version

    - name: End play when both Panoramas are already on target version
      ansible.builtin.meta: end_host
      when: primary_version == version and secondary_version == version

    - name: Backup device config (primary)
      paloaltonetworks.panos.panos_op:
        provider: '{{ primary }}'
        cmd: 'save config to {{ backup_filename }}'
      when: backup_config|bool

#   Auto syncs with peer in 11.1
#    - name: Backup device config (secondary)
#      paloaltonetworks.panos.panos_op:
#        provider: '{{ secondary }}'
#        cmd: 'save config to {{ backup_filename }}'
#      when: backup_config|bool

    # Download on primary and sync to the peer, or straight to whichever Panorama is the only one being upgraded.
    - name: Download target PAN-OS version
      paloaltonetworks.panos.panos_software:
        provider: '{{ primary if primary_version != version else secondary }}'
        version: '{{ version }}'
        download: true
        sync_to_peer: '{{ primary_version != version and secondary_version != version }}'
        install: false

    - name: Upgrade primary
      when: primary_version != version
      block:
        - name: Suspend primary device
          paloaltonetworks.panos.panos_op:
            provider: '{{ primary }}'
            cmd: 'request high-availability state suspend'

        - name: Check that secondary is now active
          paloaltonetworks.panos.panos_op:
            provider: '{{ secondary }}'
            cmd: 'show high-availability state'
          register: secondary_active
          retries: 10
          delay: 30
          until: (secondary_active.stdout | from_json).response.result["local-info"].state == 'secondary-active' and
                 (secondary_active.stdout | from_json).response.result["peer-info"].state == 'primary-suspended' and
                 (secondary_active.stdout | from_json).response.result["peer-info"]["state-reason"] == 'User requested'

        - name: Install target PAN-OS version and restart (primary)
          paloaltonetworks.panos.panos_software:
            provider: '{{ primary }}'
            version: '{{ version }}'
            download: false
            restart: true

        - name: Pause for restart
          ansible.builtin.pause:
            seconds: 30

        - name: Check that primary is up and passive
          paloaltonetworks.panos.panos_op:
            provider: '{{ primary }}'
            cmd: 'show high-availability state'
          register: primary_passive
          retries: 30
          delay: 60
          until: primary_passive is not failed and
                 (primary_passive.stdout | from_json).response.result.enabled == 'yes' and
                 (primary_passive.stdout | from_json).response.result["local-info"].state == 'primary-passive'
          when: not is_major_upgrade|bool

        # Special case, Panorama HA doesn't work across major versions like firewalls, so primary will normally be
        # non-functional.  Passive is accepted too, in case a feature release step keeps HA compatible.
        - name: Check that primary is up and non-functional (or passive)
          paloaltonetworks.panos.panos_op:
            provider: '{{ primary }}'
            cmd: 'show high-availability state'
          register: primary_nf
          retries: 30
          delay: 60
          until: primary_nf is not failed and
                 (primary_nf.stdout | from_json).response.result.enabled == 'yes' and
                 ((primary_nf.stdout | from_json).response.result["local-info"].state == 'primary-passive' or
                  ((primary_nf.stdout | from_json).response.result["local-info"].state == 'primary-non-functional' and
                   (primary_nf.stdout | from_json).response.result["local-info"]["state-reason"] == 'Peer version not compatible'))
          when: is_major_upgrade|bool

        - name: Pause for verification
          ansible.builtin.pause:
            prompt: 'Primary upgrade complete.  Pausing for verification.'
          when: pause_mid_upgrade

    - name: Upgrade secondary
      when: secondary_version != version
      block:
        - name: Suspend secondary device
          paloaltonetworks.panos.panos_op:
            provider: '{{ secondary }}'
            cmd: 'request high-availability state suspend'

        - name: Check that primary is now active
          paloaltonetworks.panos.panos_op:
            provider: '{{ primary }}'
            cmd: 'show high-availability state'
          register: primary_active
          retries: 10
          delay: 30
          until: (primary_active.stdout | from_json).response.result["local-info"].state == 'primary-active' and
                 (primary_active.stdout | from_json).response.result["peer-info"].state == 'secondary-suspended' and
                 (primary_active.stdout | from_json).response.result["peer-info"]["state-reason"] == 'User requested'

        - name: Install target PAN-OS version and restart (secondary)
          paloaltonetworks.panos.panos_software:
            provider: '{{ secondary }}'
            version: '{{ version }}'
            download: false
            restart: true

        - name: Pause for restart
          ansible.builtin.pause:
            seconds: 30

        - name: Check that secondary is up and passive
          paloaltonetworks.panos.panos_op:
            provider: '{{ secondary }}'
            cmd: 'show high-availability state'
          register: secondary_passive
          retries: 30
          delay: 60
          until: secondary_passive is not failed and
                 (secondary_passive.stdout | from_json).response.result.enabled == 'yes' and
                 (secondary_passive.stdout | from_json).response.result["local-info"].state == 'secondary-passive'
