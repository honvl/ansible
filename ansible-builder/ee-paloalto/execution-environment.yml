version: 3

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  python_interpreter:
    python_path: /usr/bin/python3.12  # must match the Python with ansible-core in the base image

# (Optional) Add system packages if Palo Alto SDK requires extra binaries
# system: bindep.txt

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: '-c'

options:
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest

additional_build_files:
  - src: ansible.cfg
    dest: configs

additional_build_steps:
  prepend_base:
    - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg
  # Make the EE's Python (PYCMD) the default python3/python, so nothing falls back to RHEL's
  # system python3.9, which lacks the pip packages.  The import check fails the build if not.
  append_final:
    - RUN ln -sf $PYCMD /usr/bin/python3 && ln -sf $PYCMD /usr/bin/python && python3 -c 'import ansible, panos, pan.xapi, jmespath, netaddr, pandas' && python -V
