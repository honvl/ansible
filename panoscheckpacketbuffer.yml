- hosts: all
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"  # EE Python that has pan-os-python etc.
  collections:
    - paloaltonetworks.panos
  tasks:
  - name: Palo Alto resource monitor
    paloaltonetworks.panos.panos_op:
      username: '{{ username }}'
      password: '{{ password }}'
      ip_address: '{{ inventory_hostname }}'
      cmd: 'show running resource-monitor hour'
  - name: Palo Alto resource monitor day
    paloaltonetworks.panos.panos_op:
      username: '{{ username }}'
      password: '{{ password }}'
      ip_address: '{{ inventory_hostname }}'
      cmd: 'show running resource-monitor day'