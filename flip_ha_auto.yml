---
# flip_ha_auto.yml - Automatically detect and flip active/passive Palo Alto firewalls
#
# Description
# ===========
# This playbook automatically detects the active member in a Palo Alto HA pair
# and flips the HA state by suspending the active device and waiting for
# the passive to become active.
#
# Usage
# =====
# Example:
#   ansible-playbook -i inventory flip_ha_auto.yml --extra-vars "target=ha_pair username=admin password=changeme"
#
# Required Variables:
#   target: Target host group (e.g., ha_pair)
#   username, password or api_key
#
# Notes
# =====
# - HA preemption must be disabled
# - Assumes both HA peers are reachable

- hosts: "{{ target | default('ha_pair') }}"
  connection: local
  gather_facts: false

  tasks:

    # If both addresses name the same firewall, the passive peer is never found and the job dies later with
    # "No first item, sequence was empty" before anything is upgraded.
    - name: Check the HA pair addresses
      assert:
        that:
          - primary_ip_address != secondary_ip_address
        fail_msg: >-
          primary_ip_address and secondary_ip_address are both {{ primary_ip_address }} for {{ inventory_hostname }}.
          Fix the inventory so they point to the two different firewalls of the HA pair.
        quiet: true

    - name: Unsuspend devices
      paloaltonetworks.panos.panos_op:
        ip_address: "{{ item }}"
        username: "{{ username | default(omit) }}"
        password: "{{ password | default(omit) }}"
        cmd: 'request high-availability state functional'
      loop:
        - "{{ primary_ip_address }}"
        - "{{ secondary_ip_address }}"
      register: unsuspend
      retries: 3
      delay: 10
      until: unsuspend is not failed

    - name: Determine which firewall is active in HA
      paloaltonetworks.panos.panos_active_in_ha:
        ip_address: "{{ item }}"
        username: "{{ username | default(omit) }}"
        password: "{{ password | default(omit) }}"
      loop:
        - "{{ inventory_ip_address }}"
        - "{{ primary_ip_address }}"
        - "{{ secondary_ip_address }}"
      register: ha_status
      retries: 3
      delay: 10
      until: ha_status is not failed

    - name: Check that one firewall is active and the other passive
      assert:
        that:
          - ha_status.results | selectattr('response.active', 'equalto', true) | list | length > 0
          - ha_status.results | selectattr('response.active', 'equalto', false) | list | length > 0
        fail_msg: >-
          Expected one active and one passive firewall.
          Active: {{ ha_status.results | selectattr('response.active', 'equalto', true) | map(attribute='item') | unique | join(', ') or 'none' }}.
          Passive: {{ ha_status.results | selectattr('response.active', 'equalto', false) | map(attribute='item') | unique | join(', ') or 'none' }}.
        quiet: true

    - name: Set active/passive devices dynamically
      set_fact:
        active_fw: "{{ (ha_status.results | selectattr('response.active', 'equalto', true) | list | first).item }}"
        passive_fw: "{{ (ha_status.results | selectattr('response.active', 'equalto', false) | list | first).item }}"
      when: ha_status.results | length > 0

    - name: Run tasks with dynamic nodes
      ansible.builtin.include_tasks: flip_ha_auto_active.yml
      when: ha_status.results[0].response.active

