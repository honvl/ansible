---
- name: Build new Palo Alto EE using EE Utils collection
  hosts: "{{ target | default('builder_host') }}"
  become: true
  become_user: dpwuser450
  tags: buildee

  vars:
    ee_version: 3
    ee_builder_dir_clean: false
    ee_builder_dir: "/home/dpwuser450/ansible/builder/paloalto_ee" # Changed from /home/ansible due to permission denied
    ee_update_base_images: true

    # Credentials are injected by the Job Template via attached credentials or extra vars.
    # Required variables: pah_username, pah_password, rh_username, rh_password
    # ah_host must also be provided (e.g. via extra vars or inventory vars)

    # Base image and registry variables
    ee_base_image: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest
    ee_base_sig_name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest
    ee_container_policy: system
    ee_base_registry_username: "{{ rh_username | default(pah_username) }}"
    ee_base_registry_password: "{{ rh_password | default(pah_password) }}"

    ee_prune_images: true
    ee_pull_collections_from_hub: false
    alt_name: "Palo Alto Execution Environment"  # existing AAP EE the job templates use; the last task updates its image
    ee_name: ee_paloalto
    ee_reg_credential: Automation Hub Container Registry
    ee_registry_dest: "{{ ah_host }}"
    ee_registry_username: "{{ pah_username }}"
    ee_registry_password: "{{ pah_password }}"
    ee_verbosity: 1

    # Define the EE structure
    ee_list:
      - name: ee_paloalto
        alt_name: "{{ alt_name }}"
        tag: "{{ ansible_date_time.iso8601_basic_short }}"
        dependencies:
          python:
            # Install any required python packages directly
            - pan-os-python
            - pan-python
            - pandevice
            - xmltodict   # PAN-OS XML output, ansible.utils from_xml/to_xml filters
            - requests
            - jmespath    # json_query filter
            - lxml        # community.general.xml module
            - netaddr     # ansible.utils ipaddr/ipv4/ipv6 filters
            - pexpect     # ansible.builtin.expect (panosscpexport.yml)
            # Cisco IOS / NX-OS / ACI
            - ansible-pylibssh  # network_cli SSH transport (preferred)
            - paramiko          # network_cli SSH fallback
            - textfsm           # cli_parse / parse_cli_textfsm
            - ntc-templates     # TextFSM templates for IOS/NX-OS show commands
            - ttp               # cli_parse ttp parser
            - xmljson           # cisco.aci XML output
            - cryptography      # cisco.aci signature-based auth
            - pandas            # iosfreeinterfaces.py (run via delegate_to: localhost)
          galaxy:
            collections:
              - name: paloaltonetworks.panos
                version: ">=3.4.0"  # 3.4.0+ knows the PAN-OS 12.1 base image is 12.1.2
              # Generic modules and filters: mail, json_query, xml, ipaddr, from_xml, cli_parse, etc.
              - name: community.general   # mail, xml, json_query
              - name: ansible.utils       # from_xml/to_xml, ipaddr, cli_parse, validate
              - name: ansible.netcommon   # dependency of ansible.utils network filters
              - name: ansible.posix       # synchronize, acl, patch, etc.
              # Cisco
              - name: cisco.ios
              - name: cisco.nxos
              - name: cisco.aci
          python_interpreter:
            python_path: "/usr/bin/python3.12"  # must match the Python with ansible-core in the base image
        build_steps:
          # Make the EE's Python (PYCMD) the default python3/python, so nothing falls back to RHEL's
          # system python3.9, which lacks the pip packages.  The import check fails the build if not.
          append_final:
            - RUN ln -sf $PYCMD /usr/bin/python3 && ln -sf $PYCMD /usr/bin/python && python3 -c 'import ansible, panos, pan.xapi, jmespath, netaddr, pandas' && python -V

  pre_tasks:
    - name: Login to PAH
      containers.podman.podman_login:
        username: "{{ pah_username }}"
        password: "{{ pah_password }}"
        registry: "{{ ah_host }}"

    - name: Login to Red Hat Registry
      containers.podman.podman_login:
        username: "{{ rh_username | default(pah_username) }}"
        password: "{{ rh_password | default(pah_password) }}"
        registry: "registry.redhat.io"

  roles:
    # Ensure these roles exist in your controller environment
    - infra.ee_utilities.ee_builder

  post_tasks:
    - name: Update Execution Environment Version in Controller with new version
      ansible.controller.execution_environment:
        name: "{{ alt_name }}"
        image: "{{ ah_host }}/{{ ee_name }}:{{ ansible_date_time.iso8601_basic_short }}"
        credential: "{{ ee_reg_credential }}"
        controller_host: "https://{{ ah_host | regex_replace('^https?://', '') }}"
        controller_username: "{{ pah_username }}"
        controller_password: "{{ pah_password }}"
        validate_certs: false
      delegate_to: localhost
      become: false
