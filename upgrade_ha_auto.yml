---
# upgrade_ha_auto.yml - PAN-OS HA pair upgrade playbook.
#
# Description
# ===========
#
# Upgrades a PAN-OS HA pair to the specified version.  For major
# version upgrades requiring a base image to be downloaded to the device prior to performing the upgrade, see the 
# 'upgrade_ha_auto_major.yml' playbook.
#
# This playbook requires connection details for the two members of the HA pair to be specified in the variables 
# 'primary_ip_address', 'secondary_ip_address', 'username', and 'password'.  These may be defined as host variables
# (see `host_vars/ha_pair.yml` for an example) or extra vars.
#
# Usage
# =====
#
# Required variables:
#
#   target: Target HA pair.  See `host_vars/ha_pair.yml` for sample definition of host variables.
#
#   version: Version to install.
#
# See the VARS section of the playbook for additional customization options.
#
#
# Notes
# =====
#
# HA pairs with preemption enabled are not supported by this playbook.

- hosts: "{{ target | default('ha_pair') }}"
  connection: local
  gather_facts: true



  vars:

    # backup_config - Create a backup of the currently running config before upgrading on both devices.
    backup_config: true

    # backup_filename - Filename for running config backup.
    backup_filename: 'ansible-backup-{{ ansible_date_time.date }}.xml'

    # pause_mid_upgrade - Optionally pause for additional verification during upgrade.  This playbook will perform
    #                     basic checks for HA status and session sync, but this will wait for manual verification before
    #                     upgrading the secondary firewall.
    pause_mid_upgrade: False

  tasks:

    # If both addresses name the same firewall, the passive peer is never found and the job dies later with
    # "No first item, sequence was empty" before anything is upgraded.
    - name: Check the HA pair addresses
      assert:
        that:
          - primary_ip_address != secondary_ip_address
        fail_msg: >-
          primary_ip_address and secondary_ip_address are both {{ primary_ip_address }} for {{ inventory_hostname }}.
          Fix the inventory so they point to the two different firewalls of the HA pair.
        quiet: true

    - name: Unsuspend devices
      paloaltonetworks.panos.panos_op:
        ip_address: "{{ item }}"
        username: "{{ username | default(omit) }}"
        password: "{{ password | default(omit) }}"
        cmd: 'request high-availability state functional'
      loop:
        - "{{ primary_ip_address }}"
        - "{{ secondary_ip_address }}"
      register: unsuspend
      retries: 3
      delay: 10
      until: unsuspend is not failed

    - name: Determine which firewall is active in HA
      paloaltonetworks.panos.panos_active_in_ha:
        ip_address: "{{ item }}"
        username: "{{ username | default(omit) }}"
        password: "{{ password | default(omit) }}"
      loop:
        - "{{ inventory_ip_address }}"
        - "{{ primary_ip_address }}"
        - "{{ secondary_ip_address }}"
      register: ha_status
      retries: 3
      delay: 10
      until: ha_status is not failed

    - name: Check that one firewall is active and the other passive
      assert:
        that:
          - ha_status.results | selectattr('response.active', 'equalto', true) | list | length > 0
          - ha_status.results | selectattr('response.active', 'equalto', false) | list | length > 0
        fail_msg: >-
          Expected one active and one passive firewall.
          Active: {{ ha_status.results | selectattr('response.active', 'equalto', true) | map(attribute='item') | unique | join(', ') or 'none' }}.
          Passive: {{ ha_status.results | selectattr('response.active', 'equalto', false) | map(attribute='item') | unique | join(', ') or 'none' }}.
        quiet: true

    - name: Set active/passive devices dynamically
      set_fact:
        primary: "{{ (ha_status.results | selectattr('response.active', 'equalto', true) | list | first).item }}"
        secondary: "{{ (ha_status.results | selectattr('response.active', 'equalto', false) | list | first).item }}"
      when: ha_status.results | length > 0

    # Firewalls already on the target version are skipped, so a rerun after a partial upgrade only finishes the other one.
    - name: Check current PAN-OS versions
      when: ha_status.results[0].response.active
      block:
        - name: Get current PAN-OS version
          paloaltonetworks.panos.panos_op:
            ip_address: "{{ item }}"
            username: "{{ username | default(omit) }}"
            password: "{{ password | default(omit) }}"
            cmd: 'show system info'
          loop:
            - "{{ primary }}"
            - "{{ secondary }}"
          changed_when: false
          register: system_info
          retries: 3
          delay: 10
          until: system_info is not failed

        - name: Set current PAN-OS versions
          ansible.builtin.set_fact:
            primary_version: "{{ (system_info.results[0].stdout | from_json).response.result.system['sw-version'] }}"
            secondary_version: "{{ (system_info.results[1].stdout | from_json).response.result.system['sw-version'] }}"

        - name: Set firewalls to upgrade
          ansible.builtin.set_fact:
            upgrade_targets: "{{ ([primary] if primary_version != version else []) + ([secondary] if secondary_version != version else []) }}"

        - name: Skip upgrade, both firewalls already on target version
          ansible.builtin.debug:
            msg: 'Both firewalls ({{ primary }}, {{ secondary }}) are already running PAN-OS {{ version }}, skipping upgrade.'
          when: upgrade_targets | length == 0

        - name: End play when both firewalls are already on target version
          ansible.builtin.meta: end_host
          when: upgrade_targets | length == 0

    - name: Run tasks with dynamic nodes
      ansible.builtin.include_tasks: upgrade_ha_auto_active.yml
      when: ha_status.results[0].response.active



