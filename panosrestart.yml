- hosts: all
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"  # EE Python that has pan-os-python etc.
  collections:
    - paloaltonetworks.panos
  tasks:
  - name: Palo Alto restart
    paloaltonetworks.panos.panos_restart:
      provider:
        username: '{{ username }}'
        password: '{{ password }}'
        ip_address: '{{ inventory_hostname }}'
